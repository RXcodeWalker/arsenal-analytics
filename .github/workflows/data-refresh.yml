name: Data Refresh Pipeline

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      BOT_GH_TOKEN: ${{ secrets.BOT_GH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run data pipeline
        run: node pipeline/run.js

      - name: Detect bot token availability
        id: token_check
        run: |
          if [ -n "${BOT_GH_TOKEN}" ]; then
            echo "has_bot_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bot_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Direct commit fallback (no BOT_GH_TOKEN)
        id: direct_fallback
        if: ${{ steps.token_check.outputs.has_bot_token != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/*.json; then
            echo "::notice::No data changes to commit."
            echo "publish_status=no_changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/*.json
          git commit -m "chore: refresh football data"
          echo "::notice::Attempting to push refreshed data directly to main."
          git push origin HEAD:main
          echo "publish_status=pushed" >> "$GITHUB_OUTPUT"

      - name: Create or update bot data PR
        id: cpr
        if: ${{ steps.token_check.outputs.has_bot_token == 'true' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.BOT_GH_TOKEN }}
          commit-message: "chore: refresh football data"
          branch: bot-updates
          base: main
          delete-branch: false
          title: "chore: refresh football data"
          body: |
            Automated data refresh from pipeline.

            - Source: scheduled GitHub Action
            - Scope: `data/*.json` only
            - Review before merge into `main`
          add-paths: |
            data/*.json

      - name: Enable auto-merge for bot PR
        if: ${{ steps.token_check.outputs.has_bot_token == 'true' && steps.cpr.outcome == 'success' && steps.cpr.outputs.pull-request-number != '' }}
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ env.BOT_GH_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Report pull request automation status
        if: ${{ always() && steps.token_check.outputs.has_bot_token == 'true' && steps.cpr.outcome != 'success' }}
        run: |
          echo "::warning::Data refresh succeeded but PR automation failed."
          echo "::warning::Set repository setting 'Allow GitHub Actions to create and approve pull requests', or add a BOT_GH_TOKEN secret (PAT with repo permissions)."

      - name: Report pull request automation disabled
        if: ${{ steps.token_check.outputs.has_bot_token != 'true' }}
        run: |
          echo "::notice::PR automation skipped because BOT_GH_TOKEN is not configured."
          echo "::notice::Direct publish status: ${{ steps.direct_fallback.outputs.publish_status || 'unknown' }}."
          echo "::notice::If branch rules block direct pushes, add BOT_GH_TOKEN to re-enable PR-based updates."

